name: Deploy WordPress Dashboard to Coolify

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build project
      run: npm run build
      
    - name: Deploy to Coolify
      run: |
        curl --request GET "${{ secrets.COOLIFY_WEBHOOK }}" \
          --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
          --fail --silent --show-error
      
    - name: Notify deployment status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ WordPress Dashboard deploy realizado com sucesso!"
        else
          echo "❌ Falha no deploy"
          exit 1
        fi

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Wait for deployment
      run: sleep 30
      
    - name: Health check
      run: |
        curl --fail --silent --show-error "${{ secrets.APP_URL }}" || \
        echo "⚠️ Health check failed - app may still be starting"